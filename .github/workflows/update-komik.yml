name: Update Daftar Komik

on:
  push:
    branches:
      - main

permissions:
  contents: write

jobs:
  generate:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Generate komik.json
        run: python3 generate_komik.py

      - name: Simpan komik.json
        run: bash save_komik.sh
